# LightGCN-LLM-HardBPR (margin mode) on Amazon-Book
experiment_name: lightgcn_llm_hardbpr_m_amazon
seed: 2024
device: cuda
output_dir: artifacts/lightgcn_llm_hardbpr_m_amazon
log_dir: logs/lightgcn_llm_hardbpr_m_amazon

data:
  type: rlmrec
  dataset: amazon
  data_dir: data/rlmrec/amazon

model:
  name: LightGCN_LLM_HardBPR
  embedding_dim: 64
  num_layers: 3
  freeze_llm: true
  hard_bpr_mode: margin
  hard_bpr_beta: 0.5

training:
  epochs: 200
  batch_size: 2048
  lr: 0.001
  weight_decay: 0.0001
  reg_weight: 0.0001
  early_stop_patience: 20
  log_interval: 10

evaluation:
  ks: [10, 20, 50]
  valid_metric: "Recall@20"
  eval_batch_size: 2048
